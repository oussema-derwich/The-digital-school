<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;800;900&display=swap');

        /* Style du scroll */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #040c83;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        ::-webkit-scrollbar-corner {
            width: 2%;
        }

        body {
            position: relative;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgb(4, 4, 35);
            margin: 0;
        }

        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 9% 2rem;
            min-width: 300px;
            max-width: 600px;
            background-image: linear-gradient(aqua, rgb(249, 146, 164));
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
            letter-spacing: 1px;
            word-spacing: 5px;
        }

        .input-group {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            width: 100%;
        }

        .input {
            border-radius: 0.5rem;
            height: 3rem;
            border: 2px solid black;
            flex-grow: 1;
            padding: 0 1rem;
            font-size: 1.2rem;
            line-height: 2;
            width: 100%;
        }

        .ajouter {
            cursor: pointer;
            background-color: green;
            color: white;
            border: none;
            outline: none;
            text-align: center;
            border-radius: 0.5rem;
            height: 3rem;
            min-height: 3rem;
            text-transform: uppercase;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1em;
            text-decoration: none;
            transition: 0.2s all cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            padding: 0 1rem;
        }

        .ajouter:hover {
            background-color: azure;
            color: black;
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            margin-bottom: 10px;
        }

        .Supprimer {
            cursor: pointer;
            background-color: green;
            color: white;
            border: none;
            outline: none;
            text-align: center;
            border-radius: 0.5rem;
            height: 3rem;
            min-height: 3rem;
            text-transform: uppercase;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1em;
            text-decoration: none;
            transition: 0.2s all cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            padding: 0 1rem;
        }

        .Supprimer:hover {
            background-color: azure;
            color: black;
        }

        .task-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            height: auto;
            max-height: 26vh;
            margin-inline-end: 8%;
            margin-block: 1%;
            overflow-y: auto;
        }

        .label-compteur {
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 20%;
            width: 91%;
            height: 100%;
            flex-direction: column;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 96%;
            height: 19%;
            margin-block: 3px;
            background: #faf0e673;
            padding: 4px;
            border-radius: 15px;
        }

        .todo-item p {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .completed {
            text-decoration: line-through;
        }

        .counter-group {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 80%;
        }

        .bottom-div {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            border: 2px dashed white;
            border-radius: 11px;
            padding: 3px;
        }

        .filter-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 100%;
            margin-bottom: 10px;
        }

        .filtre-bouton {
            background-color: green;
            color: white;
            padding: 10px 16px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        option {
            background: #f1f1f1;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ToDo List</h1>
        </header>
        <div class="input-group">
            <div class="form-group">
                <input type="text" id="task" class="input" placeholder="📑 Add your todo here..">
            </div>
            <button id="addTask" class="ajouter">Ajouter</button>
        </div>
        <div class="button-group">
            <button id="clearAll" class="Supprimer">Delete All</button>
            <button id="deleteSelected" class="Supprimer">Delete Selected</button>
        </div>

        <div class="bottom-div">
            <div class="filter-group">
                <select id="filter" class="filtre-bouton">
                    <option value="all">All</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="counter-group">
                <p>Completed: <span id="completedCount">0</span></p>
                <p>Total Tasks: <span id="totalCount">0</span></p>
            </div>
        </div>
    </div>
    <script>
        const taskInput = document.getElementById('task');
        const addTaskButton = document.getElementById('addTask');
        const clearAllButton = document.getElementById('clearAll');
        const deleteSelectedButton = document.getElementById('deleteSelected');
        const filterSelect = document.getElementById('filter');
        const taskList = document.getElementById('taskList');
        const completedCount = document.getElementById('completedCount');
        const totalCount = document.getElementById('totalCount');
    
        let tasks = [];
    
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText !== '') {
                tasks.push({ text: taskText, completed: false });
                updateTaskList();
                taskInput.value = '';
            } else {
                alert("😮 Task cannot be empty");
            }
        }
    
        function updateTaskList() {
            const filterValue = filterSelect.value;
            let filteredTasks = tasks.filter(task => {
                if (filterValue === 'all') return true;
                if (filterValue === 'pending') return !task.completed;
                if (filterValue === 'completed') return task.completed;
            });
    
            taskList.innerHTML = '';
    
            filteredTasks.forEach((task, index) => {
                const listItem = document.createElement('li');
                listItem.className = 'todo-item';
                listItem.id = Date.now();
    
                const taskParagraph = document.createElement('p');
                taskParagraph.textContent = task.text;
                taskParagraph.id = 'task';
    
                if (task.completed) {
                    taskParagraph.classList.add('completed');
                }
    
                listItem.appendChild(taskParagraph);
    
                const todoActions = document.createElement('div');
                todoActions.className = 'todo-actions';
    
                const completeButton = createButton('complete', 'btn btn-success', '\u2713 ', () => {
                    task.completed = !task.completed;
                    updateTaskList();
                });
    
                const deleteButton = createButton('delete', 'btn btn-error', '\u2715 ', () => {
                    tasks.splice(index, 1);
                    updateTaskList();
                });
    
                todoActions.appendChild(completeButton);
                todoActions.appendChild(deleteButton);
    
                listItem.appendChild(todoActions);
                taskList.appendChild(listItem);
            });
    
            completedCount.textContent = tasks.filter(task => task.completed).length;
            totalCount.textContent = tasks.length;
        }
    
        function createButton(className, btnClass, innerHTML, clickHandler) {
            const button = document.createElement('button');
            button.className = className + ' ' + btnClass;
            button.innerHTML = innerHTML;
            button.addEventListener('click', clickHandler);
            return button;
        }
    
        function clearAllTasks() {
            const confirmed = confirm("😮 Are you sure you want to delete all tasks?");
            if (confirmed) {
                tasks = [];
                updateTaskList();
            }
        }
    
        function deleteSelectedTasks() {
            const selectedTasks = tasks.filter(task => task.completed);
            if (selectedTasks.length === 0) {
                alert(" 😮 Please select at least one task to delete!");
            } else {
                tasks = tasks.filter(task => !task.completed);
                updateTaskList();
            }
        }
    
        addTaskButton.addEventListener('click', addTask);
        clearAllButton.addEventListener('click', clearAllTasks);
        deleteSelectedButton.addEventListener('click', deleteSelectedTasks);
        filterSelect.addEventListener('change', updateTaskList);
        taskList.addEventListener('change', (event) => {
            const index = event.target.dataset.index;
            if (index !== undefined) {
                tasks[index].completed = event.target.checked;
                updateTaskList();
            }
        });
    
        updateTaskList();
    </script>
    
</body>
</html>
